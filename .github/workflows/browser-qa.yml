name: Visual and functional QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Browser checks
        run: |
          python3 -m http.server 8765 > /tmp/one-many-http.log 2>&1 &
          node tests/browser-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-qa
          path: qa-results/
